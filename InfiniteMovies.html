<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-7SV03ZXJ9R">
        </script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-7SV03ZXJ9R');
        </script>
        <title>
            Infinite Campus
        </title>
        <link id="dynamic-favicon" rel="icon" type="image/png" href="/res/icon.png">
        <link rel="stylesheet" href="./global.css">
        <meta name="keywords" content="Infinite campus,infinite campus,Infinite Campus,infinite Campus">
        <meta name="description" content="Infinite Campus Is A International Buisiness And Has Good Devs">
        <meta property="og:title" content="Infinite Campus">
        <meta property="og:description" content="Infinite Campus Is An International Buisiness And Has Good Devs">
        <meta name="theme-color" content="#8cbe37">
        <link rel="manifest" href="./manifest.json">
        <script src="./main.js">
        </script>
        <script src="./drypopup.js" type="module">
        </script>
        <style>
            #progressContainer {
                width: 100%;
                background: #444;
                border-radius: 8px;
                margin-top: 10px;
                height: 16px;
                display: flex;
            }
            #progressBar {
                height: 100%;
                width: 0%;
                background: #4caf50;
                border-radius: 8px;
                transition: width 0.10s linear;
            }
            .popup2, .settings-button {
                display:none;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="ic-home ic-movies-page">
                <h6 style="display:none" class="btxt" id="currentFile">
                </h6>
                <section class="ic-movies-hero">
                    <div class="ic-movies-hero-left">
                        <div class="ic-apps-icon-box">
                            <i class="ic ic-film">
                            </i>
                        </div>
                        <div>
                            <h1 class="ic-apps-h1">
                                Movies
                            </h1>
                            <p class="ic-sub">
                                Stream Your Favorite Movies — Anytime, Anywhere!
                            </p>
                            <p class="ic-movies-hero-tagline">
                                Browse Our Collection And Find Your Next Favorite Movie.
                            </p>
                        </div>
                    </div>
                    <div class="ic-movies-hero-logo">
                        <div class="ic-logo-mark" style="width:100%;height:100%">
                        </div>
                        <img class="ic-logo-fallback" src="/res/logo.png" alt="Infinite Campus">
                    </div>
                </section>
                <details class="ic-movies-upload" id="before">
                    <summary class="ic-movies-upload-summary">
                        <i class="ic ic-cloud-upload">
                        </i>
                        Submit A Movie
                    </summary>
                    <div class="ic-movies-upload-body">
                        <input style="display:none;" type="file" id="applyFile" accept="video/*,.ts,video/mp2t,.mkv,video/x-matroska">
                        <label for="applyFile" type="file" class="ic-btn ic-btn-secondary">
                            Upload A File
                        </label>
                        <div id="selectedFileName" class="ic-movies-upload-filename">
                        </div>
                        <button class="ic-btn ic-btn-primary" onclick="uploadApply()">
                            Upload
                        </button>
                        <div id="progressContainer" style="display:none; text-align:left;">
                            <div id="progressBar" style="height: 100%; width: 0%; background: #4caf50;">
                            </div>
                        </div>
                        <div id="progressPercent" style="margin-top: 8px; font-weight: bold; text-align:center;">
                        </div>
                        <div id="uploadingText" style="text-align:center; margin-top:5px; opacity:0.8;">
                        </div>
                        <div id="upload-status">
                        </div>
                    </div>
                </details>
                <div id="section" class="ic-movies-layout">
                    <aside class="ic-movies-sidebar">
                        <h3 class="ic-movies-sidebar-title">
                            <i class="ic ic-grid-3x3-gap-fill">
                            </i>
                            Categories
                        </h3>
                        <div id="categoriesList" class="ic-movies-categories">
                        </div>
                    </aside>
                    <div class="ic-movies-main">
                        <div class="ic-movies-toolbar">
                            <a class="discord ic-movies-suggest" href="InfiniteChatters.html?channel=Movie-Requests">
                                Suggest A Movie
                            </a>
                            <div class="ic-apps-search-wrap ic-movies-search-wrap">
                                <input class="ic-apps-search" id="search" placeholder="Search Movies..." autocomplete="off" oninput="filterMovies()">
                                <i class="ic ic-search">
                                </i>
                            </div>
                            <select class="ic-movies-sort" id="sortSelect" onchange="setSortMode(this.value)">
                                <option value="order">Sort: Default Order</option>
                                <option value="name">Sort: Name (A-Z)</option>
                                <option value="popularity">Sort: Most Popular</option>
                            </select>
                            <button class="ic-btn ic-btn-secondary ic-movies-reload" onclick="loadMovies()" title="Reload List">
                                <i class="ic ic-arrow-clockwise">
                                </i>
                            </button>
                            <div class="ic-movies-view-toggle">
                                <button class="ic-movies-view-btn active" id="gridViewBtn" onclick="setMoviesView('grid')" title="Grid View">
                                    <i class="ic ic-grid-3x3-gap-fill">
                                    </i>
                                </button>
                                <button class="ic-movies-view-btn" id="listViewBtn" onclick="setMoviesView('list')" title="List View">
                                    <i class="ic ic-list-ul">
                                    </i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <div id="movies">
                            </div>
                        </div>
                    </div>
                </div>
                <div id="watchPanel">
                    <video id="watchVideo">
                    </video>
                    <div id="networkWarning">
                        Slow Network Detected
                    </div>
                    <br>
                    <br>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
        <script type="module" src="./movies.js">
        </script>
        <script src="./frame.js">
        </script>
    </body>
</html>
